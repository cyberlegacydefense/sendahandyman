  <title
     id="title1">ResidentSteward monogram crest concept</title>
  <desc
     id="desc1">Estate-style monogram crest with R in roman forest and S in italic brass, inside a thin brass ring with diamond ornaments. Below the mark: the split wordmark RESIDENT in roman caps and Steward in italic brass. Directional concept — not final production logo.</desc>
