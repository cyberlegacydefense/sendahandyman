  <title
     id="title1">ResidentSteward logo on transparent background</title>
  <desc
     id="desc1">Full vertical lockup with monogram crest above the split wordmark. No background fill, no decorative frame. Forest #1A3D2E and brass #C9A961 render directly on whatever surface the SVG is placed on. Directional concept — not final production logo.</desc>
